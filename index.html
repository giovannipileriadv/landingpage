  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

umns: repeat(auto-fit, minmax(280px, 1fr)); gap: clamp(32px,5vw,64px); align-items: start;\">\n      <div style=\"min-width: 240px;\">\n        <span style=\"font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: #1a6a70; font-weight: 700;\">Sobre o advogado<\u002Fspan>\n        <h2 style=\"font-family: 'Lora', serif; font-weight: 600; font-size: clamp(26px,3vw,38px); line-height: 1.18; margin: 14px 0 0; color: #12283f;\">Atendimento próximo e análise cuidadosa de cada caso<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"min-width: 260px;\">\n        <p style=\"margin: 0 0 20px;\">Advogado inscrito na <strong>OAB/SP sob o nº 446.038<\u002Fstrong>, com experiência em Direito Civil, Direito do Consumidor e Direito Digital. Atuo na resolução de conflitos, na elaboração de contratos personalizados e na defesa de interesses de consumidores e fornecedores, sempre com foco em soluções jurídicas práticas e adequadas a cada situação.<\u002Fp>\n        <p style=\"margin: 0 0 26px;\">Também sou professor universitário na Faculdade Anhanguera de Jundiaí/SP e no Centro Universitário Campo Limpo Paulista, onde contribuo para a formação de novos profissionais, unindo teoria e prática de forma atualizada.<\u002Fp>\n        <div style=\"background: #fff; border: 1px solid #e2ddd2; border-radius: 12px; padding: 24px 26px;\">\n          <span style=\"font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: #12283f; display: block; margin-bottom: 14px;\">Formação acadêmica<\u002Fspan>\n          <ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 12px;\">\n            <li style=\"display: flex; gap: 12px; align-items: flex-start;\"><span style=\"color: #1a6a70; font-weight: 700; margin-top: 1px;\">—<\u002Fspan><span>Bacharel em Direito pela Faculdade Anhanguera de Jundiaí.<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 12px; align-items: flex-start;\"><span style=\"color: #1a6a70; font-weight: 700; margin-top: 1px;\">—<\u002Fspan><span>Pós-graduado em Direito Civil e do Consumidor pela UniAmérica.<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 12px; align-items: flex-start;\"><span style=\"color: #1a6a70; font-weight: 700; margin-top: 1px;\">—<\u002Fspan><span>Pós-graduado em Direito Digital pela Universidade Pitágoras Unopar Anhanguera.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ÁREAS ============ -->\n  <section id=\"areas\" style=\"background: #ece6da;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: clamp(56px,7vw,96px) clamp(18px,4vw,40px);\">\n      <div style=\"max-width: 720px; margin-bottom: 44px;\">\n        <span style=\"font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: #1a6a70; font-weight: 700;\">Áreas de atuação<\u002Fspan>\n        <h2 style=\"font-family: 'Lora', serif; font-weight: 600; font-size: clamp(26px,3vw,38px); line-height: 1.18; margin: 14px 0 0; color: #12283f;\">Entenda em que situações posso ajudar<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; align-items: start;\">\n\n        <!-- Civil -->\n        <div style=\"background: #fff; border: 1px solid #e2ddd2; border-radius: 14px; padding: 30px 28px; display: flex; flex-direction: column;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 10px; background: #12283f; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6fb7bc\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h16M6 20V9l6-4 6 4v11M9 20v-6h6v6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-family: 'Lora', serif; font-size: 22px; font-weight: 600; margin: 0 0 12px; color: #12283f;\">Direito Civil<\u002Fh3>\n          <p style=\"margin: 0 0 16px; color: #4a5563;\">Atuação preventiva (<strong>consultivo<\u002Fstrong> — evitar o problema antes que vire processo) e na resolução de conflitos (<strong>contencioso<\u002Fstrong> — representação quando o litígio já existe). Entre as medidas mais comuns:<\u002Fp>\n          <ul style=\"margin: 0 0 20px; padding: 0; list-style: none; display: grid; gap: 9px;\">\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Ações indenizatórias por danos materiais e morais<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Usucapião, reintegração e manutenção de posse, interdito proibitório<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Ações de obrigação de fazer<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Rescisão de contratos e devolução de valores<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Ações relativas a fraudes via Pix<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Pedidos de liminar<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Cobrança e recuperação de crédito<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Execuções<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Defesas em geral: contestações, embargos à execução, embargos de terceiro e exceção de pré-executividade<\u002Fspan><\u002Fli>\n          <\u002Ful>\n          <a href=\"#contato\" style=\"margin-top: auto; color: #1a6a70; font-weight: 600;\" style-hover=\"color:#145257;\">Fale sobre este assunto →<\u002Fa>\n        <\u002Fdiv>\n\n        <!-- Consumidor -->\n        <div style=\"background: #fff; border: 1px solid #e2ddd2; border-radius: 14px; padding: 30px 28px; display: flex; flex-direction: column;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 10px; background: #12283f; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6fb7bc\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 6h15l-1.5 9h-12L6 6zM6 6L5 3H3M9 20a1 1 0 1 0 0-.01M18 20a1 1 0 1 0 0-.01\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-family: 'Lora', serif; font-size: 22px; font-weight: 600; margin: 0 0 12px; color: #12283f;\">Direito do Consumidor<\u002Fh3>\n          <p style=\"margin: 0 0 16px; color: #4a5563;\">Sempre que você compra um produto ou contrata um serviço como destinatário final, existe uma relação de consumo protegida por lei — cobrança indevida, defeito não resolvido, propaganda enganosa, negativação indevida e cláusulas abusivas são situações comuns. A atuação inclui:<\u002Fp>\n          <ul style=\"margin: 0 0 20px; padding: 0; list-style: none; display: grid; gap: 9px;\">\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Elaboração e revisão de contratos de relação de consumo<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Atuação nas esferas judicial e extrajudicial dos litígios de consumo<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span>Capacitação e treinamento de equipes, inclusive de profissionais de SAC (Serviço de Atendimento ao Consumidor)<\u002Fspan><\u002Fli>\n          <\u002Ful>\n          <a href=\"#contato\" style=\"margin-top: auto; color: #1a6a70; font-weight: 600;\" style-hover=\"color:#145257;\">Fale sobre este assunto →<\u002Fa>\n        <\u002Fdiv>\n\n        <!-- Bancário -->\n        <div style=\"background: #fff; border: 1px solid #e2ddd2; border-radius: 14px; padding: 30px 28px; display: flex; flex-direction: column;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 10px; background: #12283f; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6fb7bc\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10l9-6 9 6M5 10v9M19 10v9M9 10v9M15 10v9M3 20h18\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-family: 'Lora', serif; font-size: 22px; font-weight: 600; margin: 0 0 12px; color: #12283f;\">Direito Bancário<\u002Fh3>\n          <p style=\"margin: 0 0 16px; color: #4a5563;\">Muitos descontos e contratos com bancos passam despercebidos. Verifique se alguma destas situações se parece com a sua:<\u002Fp>\n          <ul style=\"margin: 0 0 20px; padding: 0; list-style: none; display: grid; gap: 9px;\">\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span><strong>RMC e RCC<\u002Fstrong> (cartões de crédito consignado): descontos que se repetem sem quitar a dívida como se espera<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span><strong>Descontos indevidos<\u002Fstrong> na conta ou benefício: tarifas, seguros ou pacotes não contratados de forma consciente<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span><strong>Contratações que você não realizou<\u002Fstrong>: empréstimos ou cartões formalizados sem autorização válida<\u002Fspan><\u002Fli>\n            <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: #4a5563; line-height: 1.45;\"><span style=\"color: #1a6a70; margin-top: 2px; flex-shrink: 0; font-size: 12px;\">▪<\u002Fspan><span><strong>Juros de financiamento de veículo<\u002Fstrong> em possível descompasso com a média de mercado<\u002Fspan><\u002Fli>\n          <\u002Ful>\n          <a href=\"#contato\" style=\"margin-top: auto; color: #1a6a70; font-weight: 600;\" style-hover=\"color:#145257;\">Fale sobre este assunto →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin: 28px 0 0; font-size: 15px; color: #6a7482; max-width: 780px; font-style: italic;\"><br><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ COMO FUNCIONA ============ -->\n  <section id=\"atendimento\" style=\"max-width: 1180px; margin: 0 auto; padding: clamp(56px,7vw,96px) clamp(18px,4vw,40px);\">\n    <div style=\"max-width: 720px; margin-bottom: 44px;\">\n      <span style=\"font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: #1a6a70; font-weight: 700;\">Como funciona o atendimento<\u002Fspan>\n      <h2 style=\"font-family: 'Lora', serif; font-weight: 600; font-size: clamp(26px,3vw,38px); line-height: 1.18; margin: 14px 0 12px; color: #12283f;\">Um processo transparente, do primeiro contato ao acompanhamento<\u002Fh2>\n      <p style=\"margin: 0; color: #4a5563;\">O primeiro contato serve para entender a sua situação com calma — não para fechar nada na hora.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px;\">\n      <div style=\"border-top: 3px solid #1a6a70; padding-top: 20px;\">\n        <span style=\"font-family: 'Lora', serif; font-size: 34px; font-weight: 700; color: #cdd6cf; color: #1a6a70;\">01<\u002Fspan>\n        <h4 style=\"font-family: 'Lora', serif; font-size: 19px; font-weight: 600; margin: 6px 0 8px; color: #12283f;\">Você entra em contato<\u002Fh4>\n        <p style=\"margin: 0; color: #4a5563; font-size: 16.5px;\">Descreve sua situação por WhatsApp ou pelo formulário, com suas palavras — sem precisar de termos técnicos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 3px solid #1a6a70; padding-top: 20px;\">\n        <span style=\"font-family: 'Lora', serif; font-size: 34px; font-weight: 700; color: #1a6a70;\">02<\u002Fspan>\n        <h4 style=\"font-family: 'Lora', serif; font-size: 19px; font-weight: 600; margin: 6px 0 8px; color: #12283f;\">Análise da documentação<\u002Fh4>\n        <p style=\"margin: 0; color: #4a5563; font-size: 16.5px;\">Reunimos e examinamos os documentos relevantes (extratos, contratos, comprovantes) para compreender o caso.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 3px solid #1a6a70; padding-top: 20px;\">\n        <span style=\"font-family: 'Lora', serif; font-size: 34px; font-weight: 700; color: #1a6a70;\">03<\u002Fspan>\n        <h4 style=\"font-family: 'Lora', serif; font-size: 19px; font-weight: 600; margin: 6px 0 8px; color: #12283f;\">Orientação sobre as opções<\u002Fh4>\n        <p style=\"margin: 0; color: #4a5563; font-size: 16.5px;\">Explico, de forma clara, quais são os caminhos jurídicos cabíveis e o que cada um envolve.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 3px solid #1a6a70; padding-top: 20px;\">\n        <span style=\"font-family: 'Lora', serif; font-size: 34px; font-weight: 700; color: #1a6a70;\">04<\u002Fspan>\n        <h4 style=\"font-family: 'Lora', serif; font-size: 19px; font-weight: 600; margin: 6px 0 8px; color: #12283f;\">Acompanhamento<\u002Fh4>\n        <p style=\"margin: 0; color: #4a5563; font-size: 16.5px;\">Caso você decida seguir com a medida cabível, acompanho o andamento e mantenho você informado.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FAQ ============ -->\n  <section id=\"faq\" style=\"background: #12283f; color: #dfe6ee;\">\n    <div style=\"max-width: 900px; margin: 0 auto; padding: clamp(56px,7vw,96px) clamp(18px,4vw,40px);\">\n      <div style=\"text-align: center; margin-bottom: 44px;\">\n        <span style=\"font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: #6fb7bc; font-weight: 700;\">Dúvidas frequentes<\u002Fspan>\n        <h2 style=\"font-family: 'Lora', serif; font-weight: 600; font-size: clamp(26px,3vw,38px); line-height: 1.18; margin: 14px 0 0; color: #fff;\">Perguntas comuns, respondidas de forma simples<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 14px;\">\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">O que é RMC e como diferenciar de um empréstimo comum no meu extrato?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">RMC é a sigla de Reserva de Margem Consignável — uma modalidade de cartão de crédito consignado. Diferente de um empréstimo comum, em que o valor é fixo e as parcelas reduzem a dívida até zerá-la, no cartão consignado o desconto mensal costuma corresponder a um valor mínimo, e o saldo pode se manter por muito tempo. No extrato, procure descrições como \"RMC\", \"reserva de margem\", \"cartão consignado\" ou tarifas mensais recorrentes ligadas a um cartão que você não usa.<\u002Fp>\n        <\u002Fdetails>\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">Posso contestar descontos na minha conta que não reconheço?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">Cobranças de tarifas, seguros ou serviços que você não contratou de forma consciente podem ser questionadas. O primeiro passo é reunir os extratos que mostram os descontos e identificar há quanto tempo eles ocorrem. A partir dessa análise, é possível avaliar qual medida é a mais adequada para o seu caso específico.<\u002Fp>\n        <\u002Fdetails>\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">O que fazer se descobri um empréstimo em meu nome que não contratei?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">Guarde todos os documentos e comunicações relacionados (contratos, mensagens, comprovantes) e evite fazer acordos antes de entender a origem da contratação. Contratações feitas sem autorização válida do titular — por fraude ou falha na contratação — podem ser questionadas juridicamente. Cada situação precisa ser analisada individualmente para definir o caminho apropriado.<\u002Fp>\n        <\u002Fdetails>\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">Como saber se os juros do meu financiamento de veículo estão fora do padrão?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">É preciso examinar o contrato de financiamento e comparar a taxa aplicada com a média praticada no mercado para operações semelhantes, com garantia. Não existe uma resposta única: depende do contrato, da data e das condições da operação. Por isso, a análise do documento é o ponto de partida para verificar se há espaço para revisão.<\u002Fp>\n        <\u002Fdetails>\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">Que documentos devo reunir antes de conversar com um advogado?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">Em geral, ajuda ter em mãos: documento de identidade, comprovante de residência, extratos bancários ou do benefício que mostrem os descontos, e o contrato relacionado ao problema (empréstimo, cartão, financiamento ou serviço). Quanto mais completa a documentação, mais precisa é a análise inicial. Se você não tiver tudo, não há problema — dá para começar com o que houver.<\u002Fp>\n        <\u002Fdetails>\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">O que caracteriza uma relação de consumo?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">De forma simples, há relação de consumo quando você adquire um produto ou serviço como destinatário final, de um fornecedor que atua profissionalmente. Nessas situações aplica-se o Código de Defesa do Consumidor, que traz proteções em casos como cobrança indevida, defeito não resolvido, propaganda enganosa e negativação indevida do seu nome.<\u002Fp>\n        <\u002Fdetails>\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">Qual a diferença entre atuação consultiva e contenciosa?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">A atuação <strong>consultiva<\u002Fstrong> busca prevenir problemas — por exemplo, revisar um contrato antes de assiná-lo ou orientar sobre a melhor forma de conduzir uma situação. A <strong>contenciosa<\u002Fstrong> ocorre quando o conflito já existe e é necessário representá-lo, inclusive em juízo. Muitos casos começam no consultivo justamente para evitar que se tornem litígio.<\u002Fp>\n        <\u002Fdetails>\n\n        <details style=\"background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 4px 24px;\">\n          <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-family: 'Lora', serif; font-size: 18.5px; font-weight: 600; color: #fff;\">Como é o primeiro atendimento? É presencial ou on-line?<span class=\"faq-plus\" style=\"flex-shrink: 0; color: #6fb7bc; font-size: 24px; transition: transform .2s; line-height: 1;\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"margin: 0 0 18px; color: #c3cedb; font-size: 16.5px;\">O primeiro contato pode ser por WhatsApp ou pelo formulário deste site, e serve para entender a sua situação e orientar os próximos passos. A partir daí, combinamos a melhor forma de dar continuidade. O atendimento inicial é uma conversa para compreender o caso — não há compromisso de contratação nesse momento.<\u002Fp>\n        <\u002Fdetails>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CONTATO ============ -->\n  <section id=\"contato\" style=\"max-width: 1180px; margin: 0 auto; padding: clamp(56px,7vw,96px) clamp(18px,4vw,40px);\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(32px,5vw,60px); align-items: start;\">\n      <div style=\"min-width: 260px;\">\n        <span style=\"font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: #1a6a70; font-weight: 700;\">Contato<\u002Fspan>\n        <h2 style=\"font-family: 'Lora', serif; font-weight: 600; font-size: clamp(26px,3vw,38px); line-height: 1.18; margin: 14px 0 16px; color: #12283f;\">Vamos conversar sobre a sua situação<\u002Fh2>\n        <p style=\"margin: 0 0 32px; color: #4a5563;\">Envie uma mensagem descrevendo, com suas palavras, o que está acontecendo. O objetivo do primeiro contato é entender o caso e orientar os próximos passos.<\u002Fp>\n\n        <div style=\"display: grid; gap: 18px;\">\n          <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; gap: 14px; align-items: center; background: #fff; border: 1px solid #e2ddd2; border-radius: 12px; padding: 16px 20px;\" style-hover=\"border-color:#1a6a70;\">\n            <span style=\"width: 42px; height: 42px; flex-shrink: 0; border-radius: 9px; background: #1a6a70; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M12 2C6.48 2 2 6.48 2 12c0 1.77.46 3.42 1.27 4.86L2 22l5.28-1.24A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18.2a8.16 8.16 0 0 1-4.16-1.14l-.3-.18-3.1.73.74-3.02-.2-.31A8.2 8.2 0 1 1 20.2 12 8.2 8.2 0 0 1 12 20.2zm4.5-6.5c-.25-.13-1.47-.72-1.7-.8-.23-.09-.4-.13-.56.13-.17.25-.64.8-.79.97-.14.17-.29.19-.54.06-.25-.13-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.42h-.48c-.16 0-.43.06-.66.31-.23.25-.86.85-.86 2.07s.89 2.4 1.01 2.57c.13.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.23-.17-.48-.3z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span><span style=\"display: block; font-size: 13px; color: #8a929e; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;\">WhatsApp<\u002Fspan><span style=\"font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: #12283f;\">(11) 9 1374-4824<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n          <a href=\"mailto:giovanni@pileri.adv.br\" style=\"display: flex; gap: 14px; align-items: center; background: #fff; border: 1px solid #e2ddd2; border-radius: 12px; padding: 16px 20px;\" style-hover=\"border-color:#1a6a70;\">\n            <span style=\"width: 42px; height: 42px; flex-shrink: 0; border-radius: 9px; background: #12283f; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6fb7bc\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"m3 7 9 6 9-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span><span style=\"display: block; font-size: 13px; color: #8a929e; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;\">E-mail<\u002Fspan><span style=\"font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: #12283f;\">giovanni@pileri.adv.br<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n          <div style=\"display: flex; gap: 14px; align-items: center; background: #fff; border: 1px solid #e2ddd2; border-radius: 12px; padding: 16px 20px;\">\n            <span style=\"width: 42px; height: 42px; flex-shrink: 0; border-radius: 9px; background: #12283f; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6fb7bc\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-6.13-7-11a7 7 0 0 1 14 0c0 4.87-7 11-7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n            <span><span style=\"display: block; font-size: 13px; color: #8a929e; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;\">Atuação<\u002Fspan><span style=\"font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: #12283f;\">Jundiaí/SP e região<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Formulário -->\n      <div style=\"background: #fff; border: 1px solid #e2ddd2; border-radius: 16px; padding: clamp(24px,3vw,36px); min-width: 280px;\">\n        <sc-if value=\"{{ enviado }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align: center; padding: 30px 10px;\">\n            <div style=\"width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 50%; background: #e6f0f0; display: flex; align-items: center; justify-content: center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1a6a70\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 13 4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <h3 style=\"font-family: 'Lora', serif; font-size: 22px; color: #12283f; margin: 0 0 10px;\">Mensagem preparada<\u002Fh3>\n            <p style=\"color: #4a5563; margin: 0 0 24px;\">Abrimos o WhatsApp com o seu resumo. Se preferir, você também pode enviar por e-mail. Retornarei o contato assim que possível.<\u002Fp>\n            <button onclick=\"{{ resetar }}\" style=\"background: transparent; border: 1px solid #cbd2da; color: #12283f; font-family: inherit; font-size: 15px; font-weight: 600; padding: 11px 22px; border-radius: 8px; cursor: pointer;\">Enviar outra mensagem<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ naoEnviado }}\" hint-placeholder-val=\"{{ true }}\">\n          <form onsubmit=\"{{ enviarForm }}\">\n            <div style=\"display: grid; gap: 16px;\">\n              <label style=\"display: block;\"><span style=\"display: block; font-size: 14px; font-weight: 600; color: #12283f; margin-bottom: 6px;\">Nome<\u002Fspan><input name=\"nome\" type=\"text\" required=\"\" placeholder=\"Seu nome completo\" style=\"width: 100%; padding: 12px 14px; font-family: inherit; font-size: 16px; border: 1px solid #d3d8de; border-radius: 8px; background: #fbfaf7;\"><\u002Flabel>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n                <label style=\"display: block;\"><span style=\"display: block; font-size: 14px; font-weight: 600; color: #12283f; margin-bottom: 6px;\">Telefone<\u002Fspan><input name=\"telefone\" type=\"tel\" required=\"\" placeholder=\"(11) 90000-0000\" style=\"width: 100%; padding: 12px 14px; font-family: inherit; font-size: 16px; border: 1px solid #d3d8de; border-radius: 8px; background: #fbfaf7;\"><\u002Flabel>\n                <label style=\"display: block;\"><span style=\"display: block; font-size: 14px; font-weight: 600; color: #12283f; margin-bottom: 6px;\">E-mail<\u002Fspan><input name=\"email\" type=\"email\" placeholder=\"voce@email.com\" style=\"width: 100%; padding: 12px 14px; font-family: inherit; font-size: 16px; border: 1px solid #d3d8de; border-radius: 8px; background: #fbfaf7;\"><\u002Flabel>\n              <\u002Fdiv>\n              <label style=\"display: block;\"><span style=\"display: block; font-size: 14px; font-weight: 600; color: #12283f; margin-bottom: 6px;\">Área de interesse<\u002Fspan>\n                <select name=\"area\" style=\"width: 100%; padding: 12px 14px; font-family: inherit; font-size: 16px; border: 1px solid #d3d8de; border-radius: 8px; background: #fbfaf7;\">\n                  <option>Direito Bancário<\u002Foption>\n                  <option>Direito do Consumidor<\u002Foption>\n                  <option>Direito Civil<\u002Foption>\n                  <option>Não tenho certeza<\u002Foption>\n                <\u002Fselect>\n              <\u002Flabel>\n              <label style=\"display: block;\"><span style=\"display: block; font-size: 14px; font-weight: 600; color: #12283f; margin-bottom: 6px;\">Mensagem<\u002Fspan><textarea name=\"mensagem\" rows=\"4\" required=\"\" placeholder=\"Descreva brevemente a sua situação.\" style=\"width: 100%; padding: 12px 14px; font-family: inherit; font-size: 16px; border: 1px solid #d3d8de; border-radius: 8px; background: #fbfaf7; resize: vertical;\"><\u002Ftextarea><\u002Flabel>\n              <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #5b6674; line-height: 1.5;\"><input name=\"lgpd\" type=\"checkbox\" required=\"\" style=\"margin-top: 4px; width: 17px; height: 17px; flex-shrink: 0; accent-color: #1a6a70;\"><span>Autorizo o contato e o tratamento dos meus dados para retorno desta mensagem, conforme a Lei Geral de Proteção de Dados (LGPD).<\u002Fspan><\u002Flabel>\n              <button type=\"submit\" style=\"width: 100%; background: #1a6a70; color: #fff; font-family: inherit; font-size: 17px; font-weight: 600; padding: 15px; border: none; border-radius: 8px; cursor: pointer;\" style-hover=\"background:#145257;\">Enviar mensagem<\u002Fbutton>\n              <p style=\"margin: 0; font-size: 13.5px; color: #8a929e; text-align: center;\">Ao enviar, seu resumo é aberto no WhatsApp para agilizar o contato.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ RODAPÉ ============ -->\n  <footer style=\"background: #0d1e30; color: #9fb0c0;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: clamp(44px,5vw,64px) clamp(18px,4vw,40px);\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 32px; padding-bottom: 34px; border-bottom: 1px solid rgba(255,255,255,.1);\">\n        <div style=\"min-width: 240px; flex: 2;\">\n          <div style=\"font-family: 'Lora', serif; font-size: 20px; font-weight: 600; color: #fff;\">Giovanni da Cunha Pileri<\u002Fdiv>\n          <div style=\"font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #6fb7bc; font-weight: 600; margin-top: 4px;\">Advogado · OAB/SP 446.038<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 15.5px; max-width: 340px;\">Atuação em Direito Civil, do Consumidor e Bancário — Jundiaí/SP e região.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"min-width: 150px;\">\n          <div style=\"font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; font-weight: 600; margin-bottom: 14px;\">Navegação<\u002Fdiv>\n          <div style=\"display: grid; gap: 10px;\">\n            <a href=\"#areas\" style=\"color: #9fb0c0; font-size: 15.5px;\" style-hover=\"color:#fff;\">Áreas de Atuação<\u002Fa>\n            <a href=\"#sobre\" style=\"color: #9fb0c0; font-size: 15.5px;\" style-hover=\"color:#fff;\">Sobre<\u002Fa>\n            <a href=\"#faq\" style=\"color: #9fb0c0; font-size: 15.5px;\" style-hover=\"color:#fff;\">Dúvidas Frequentes<\u002Fa>\n            <a href=\"#contato\" style=\"color: #9fb0c0; font-size: 15.5px;\" style-hover=\"color:#fff;\">Contato<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width: 150px;\">\n          <div style=\"font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; font-weight: 600; margin-bottom: 14px;\">Contato<\u002Fdiv>\n          <div style=\"display: grid; gap: 10px;\">\n            <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"color: #9fb0c0; font-size: 15.5px;\" style-hover=\"color:#fff;\">WhatsApp (11) 9 1374-4824<\u002Fa>\n            <a href=\"mailto:giovanni@pileri.adv.br\" style=\"color: #9fb0c0; font-size: 15.5px;\" style-hover=\"color:#fff;\">giovanni@pileri.adv.br<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 28px 0 0; font-size: 13.5px; line-height: 1.6; color: #7d8ea0; max-width: 860px;\">Este site tem finalidade meramente informativa, em conformidade com o Provimento 205/2021 do Conselho Federal da OAB. As informações aqui apresentadas não configuram consultoria jurídica para casos concretos nem garantia de resultado. Cada caso deve ser analisado individualmente.<\u002Fp>\n      <div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center; font-size: 13.5px; color: #64768a;\">\n        <span>© 2026 Giovanni da Cunha Pileri · OAB/SP 446.038. Todos os direitos reservados.<\u002Fspan>\n        <a href=\"#privacidade\" onclick=\"{{ abrirPrivacidade }}\" style=\"color: #9fb0c0;\" style-hover=\"color:#fff;\">Política de Privacidade (LGPD)<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- ============ POLÍTICA DE PRIVACIDADE (modal) ============ -->\n  <sc-if value=\"{{ privacidadeAberta }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ fecharPrivacidade }}\" style=\"position: fixed; inset: 0; z-index: 90; background: rgba(13,30,48,.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px;\">\n      <div onclick=\"{{ pararPropagacao }}\" style=\"background: #fff; max-width: 640px; width: 100%; max-height: 84vh; overflow-y: auto; border-radius: 16px; padding: clamp(26px,4vw,40px);\">\n        <div style=\"display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 18px;\">\n          <h3 style=\"font-family: 'Lora', serif; font-size: 26px; color: #12283f; margin: 0;\">Política de Privacidade<\u002Fh3>\n          <button onclick=\"{{ fecharPrivacidade }}\" style=\"background: #f0ede6; border: none; width: 36px; height: 36px; border-radius: 8px; font-size: 20px; color: #12283f; cursor: pointer; flex-shrink: 0;\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"color: #4a5563; font-size: 15.5px; line-height: 1.65; display: grid; gap: 14px;\">\n          <p style=\"margin: 0;\">Esta política descreve como os dados informados no formulário de contato deste site são tratados, em conformidade com a Lei nº 13.709/2018 (LGPD).<\u002Fp>\n          <p style=\"margin: 0;\"><strong>Dados coletados.<\u002Fstrong> Coletamos apenas os dados que você fornece voluntariamente no formulário: nome, telefone, e-mail, área de interesse e o conteúdo da sua mensagem.<\u002Fp>\n          <p style=\"margin: 0;\"><strong>Finalidade.<\u002Fstrong> Os dados são utilizados exclusivamente para responder ao seu contato e compreender a situação descrita. Não são usados para captação ativa de clientela, nem compartilhados com terceiros para fins comerciais.<\u002Fp>\n          <p style=\"margin: 0;\"><strong>Armazenamento e segurança.<\u002Fstrong> As informações são mantidas apenas pelo tempo necessário ao atendimento e tratadas com medidas razoáveis de segurança.<\u002Fp>\n          <p style=\"margin: 0;\"><strong>Seus direitos.<\u002Fstrong> Você pode, a qualquer momento, solicitar acesso, correção ou exclusão dos seus dados pelos canais de contato indicados neste site.<\u002Fp>\n          <p style=\"margin: 0; font-size: 13.5px; color: #8a929e;\">Recomenda-se revisar este texto com um responsável antes da publicação para adequá-lo às práticas efetivas de tratamento de dados.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ WHATSAPP FLUTUANTE ============ -->\n  <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Falar pelo WhatsApp\" style=\"position: fixed; bottom: 22px; right: 22px; z-index: 80; width: 60px; height: 60px; border-radius: 50%; background: #25a366; display: flex; align-items: center; justify-content: center; animation: floatpulse 2.6s ease-in-out infinite;\">\n    <svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M12 2C6.48 2 2 6.48 2 12c0 1.77.46 3.42 1.27 4.86L2 22l5.28-1.24A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18.2a8.16 8.16 0 0 1-4.16-1.14l-.3-.18-3.1.73.74-3.02-.2-.31A8.2 8.2 0 1 1 20.2 12 8.2 8.2 0 0 1 12 20.2zm4.5-6.5c-.25-.13-1.47-.72-1.7-.8-.23-.09-.4-.13-.56.13-.17.25-.64.8-.79.97-.14.17-.29.19-.54.06-.25-.13-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.42h-.48c-.16 0-.43.06-.66.31-.23.25-.86.85-.86 2.07s.89 2.4 1.01 2.57c.13.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.23-.17-.48-.3z\"><\u002Fpath><\u002Fsvg>\n  <\u002Fa>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { enviado: false, privacidadeAberta: false };\n\n  waLink() {\n    return \"https://wa.me/5511913744824?text=\" + encodeURIComponent(\"Olá, Dr. Giovanni. Gostaria de conversar sobre uma situação jurídica.\");\n  }\n\n  renderVals() {\n    return {\n      waLink: this.waLink(),\n      enviado: this.state.enviado,\n      naoEnviado: !this.state.enviado,\n      privacidadeAberta: this.state.privacidadeAberta,\n      enviarForm: (e) => {\n        e.preventDefault();\n        const f = e.target;\n        const nome = (f.nome && f.nome.value || \"\").trim();\n        const tel = (f.telefone && f.telefone.value || \"\").trim();\n        const email = (f.email && f.email.value || \"\").trim();\n        const area = (f.area && f.area.value || \"\").trim();\n        const msg = (f.mensagem && f.mensagem.value || \"\").trim();\n        let texto = \"Olá, Dr. Giovanni.\\n\\n\";\n        texto += \"Nome: \" + nome + \"\\n\";\n        if (tel) texto += \"Telefone: \" + tel + \"\\n\";\n        if (email) texto += \"E-mail: \" + email + \"\\n\";\n        if (area) texto += \"Área de interesse: \" + area + \"\\n\";\n        texto += \"\\n\" + msg;\n        const link = \"https://wa.me/5511913744824?text=\" + encodeURIComponent(texto);\n        window.open(link, \"_blank\", \"noopener\");\n        this.setState({ enviado: true });\n      },\n      resetar: () => this.setState({ enviado: false }),\n      abrirPrivacidade: (e) => { if (e) e.preventDefault(); this.setState({ privacidadeAberta: true }); },\n      fecharPrivacidade: () => this.setState({ privacidadeAberta: false }),\n      pararPropagacao: (e) => { if (e) e.stopPropagation(); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
